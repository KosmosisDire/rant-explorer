# Builds the web page, then the explorer on Windows, Linux and macOS with the page embedded,
# for every push to main and every pull request. A pushed tag v<VERSION> also attaches the
# exe of each platform and a zip of the page to a GitHub Release.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  # The page every exe serves with --web-server. The zip is for hosting it elsewhere.
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 3.1.56
          "$HOME/emsdk/emsdk" activate 3.1.56
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake --preset web
          cmake --build --preset web

      - name: Zip the page
        run: |
          mkdir out
          (cd bin/web && zip -r "../../out/rant-explorer-$(cat ../../VERSION)-web.zip" .)
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: page
          path: bin/web

      - uses: actions/upload-artifact@v7
        with:
          name: rant-explorer-web
          path: out/*

  # Linux builds on ubuntu-22.04 so the binary runs on glibc 2.35 and newer.
  build:
    name: ${{ matrix.name }}
    needs: [web]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: win-x64,   preset: windows }
          - { os: ubuntu-22.04,   name: linux-x64, preset: linux }
          - { os: macos-latest,   name: osx-arm64, preset: macos }

    steps:
      - uses: actions/checkout@v7

      - name: The tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      # Ninja, plus the X11, Wayland and GL headers SDL3 compiles against.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev \
            libxkbcommon-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols

      - name: macOS build deps
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: actions/download-artifact@v8
        with:
          name: page
          path: page

      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }} -DEXPLORER_WEB_DIR=page
          cmake --build --preset ${{ matrix.preset }}

      # The assets and the page are embedded, so the exe is the whole program.
      - name: Name the exe
        shell: bash
        run: |
          mkdir out
          name="rant-explorer-$(cat VERSION)-${{ matrix.name }}"
          if [ -f bin/rant_explorer.exe ]; then cp bin/rant_explorer.exe "out/$name.exe"; else cp bin/rant_explorer "out/$name"; fi
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: rant-explorer-${{ matrix.name }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/rant-explorer-*/*
          generate_release_notes: true
