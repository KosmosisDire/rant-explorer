<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Rant Explorer</title>
<link rel="icon" href="Logo.png">
<style>
  :root {
    --bg: #141414; --panel: #1b1b1b; --border: #383838; --text: #ededed; --dim: #9a9a9a;
    --accent: #dc3853; --red: #d2574b;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font: 14px system-ui, sans-serif; }
  /* The page sizes the canvas, and SDL follows its CSS size at every resize. */
  canvas { display: block; outline: none; width: 100%; height: 100%; }
  /* A finger on the explorer never flashes, selects or calls up the browser's own menus. */
  html, body, canvas { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
                       -webkit-user-select: none; user-select: none; }
  form input { -webkit-user-select: text; user-select: text; }
  form { position: fixed; inset: 0; margin: auto; width: min(360px, calc(100% - 32px)); height: fit-content;
         display: grid; gap: 12px; padding: 24px; background: var(--panel); border: 1px solid var(--border);
         border-radius: 8px; z-index: 2; }
  form[hidden] { display: none; }
  h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  label { display: grid; gap: 4px; color: var(--dim); font-size: 12px; }
  input, select { padding: 7px 9px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
                  border-radius: 4px; font: inherit; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  /* one fixed line, so nothing below moves when the found bridges replace the button */
  .find { height: 32px; display: flex; align-items: center; margin-top: -6px; }
  .find select { width: 100%; }
  .find [hidden] { display: none; }
  button.link { padding: 0; background: none; color: var(--dim); font-weight: 400; text-decoration: underline; }
  button { padding: 8px; background: var(--accent); color: #fff; border: 0; border-radius: 4px; font: inherit;
           font-weight: 600; cursor: pointer; }
  #state { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 6px 12px;
           background: var(--panel); border: 1px solid var(--border); border-radius: 4px; z-index: 3; }
  #state.bad { border-color: var(--red); }
  #state[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<form id="connect" hidden>
  <h1>Connect to a Rant bridge</h1>
  <label>Bridge <input name="bridge" spellcheck="false" autocomplete="off" placeholder="192.168.1.20 or wss://bridge.example.com"></label>
  <div class="find"><button type="button" id="find" class="link">Find bridges on this network</button><select id="found" hidden></select></div>
  <label>Passphrase <input name="passphrase" type="password" autocomplete="current-password"></label>
  <label>Domain <input name="domain" inputmode="numeric"></label>
  <button>Connect</button>
</form>
<div id="state" hidden></div>
<script type="module" src="explorer.js"></script>
</body>
</html>
