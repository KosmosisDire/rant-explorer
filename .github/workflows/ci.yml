# Builds the web page, then the explorer on Windows, Linux and macOS with the page embedded,
# for every push to main and every pull request. A run on main whose VERSION has no tag yet
# also releases it, with the exe of each platform, the archives rant install unpacks and a zip
# of the page attached.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  # Whether this run releases: on main, when no tag v<VERSION> exists yet
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        run: |
          v="$(tr -d '\r\n' < VERSION)"
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null || found=$?
          # 2 is no such tag, anything else a lookup that went wrong
          test "$found" = 0 || test "$found" = 2
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$found" = 2 ]; then release=true; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # The page every exe serves with --web-server. The zip is for hosting it elsewhere.
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 3.1.56
          "$HOME/emsdk/emsdk" activate 3.1.56
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake --preset web
          cmake --build --preset web

      - name: Zip the page
        run: |
          mkdir out
          (cd bin/web && zip -r "../../out/rant-explorer-$(cat ../../VERSION)-web.zip" .)
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: page
          path: bin/web

      - uses: actions/upload-artifact@v7
        with:
          name: rant-explorer-web
          path: out/*

  # Linux builds on ubuntu-22.04 so the binary runs on glibc 2.35 and newer.
  build:
    name: ${{ matrix.name }}
    needs: [web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: win-x64,   preset: windows }
          - { os: ubuntu-22.04,   name: linux-x64, preset: linux }
          - { os: macos-latest,   name: osx-arm64, preset: macos }

    steps:
      - uses: actions/checkout@v7

      # Ninja, plus the X11, Wayland and GL headers SDL3 compiles against.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev \
            libxkbcommon-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols

      - name: macOS build deps
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: actions/download-artifact@v8
        with:
          name: page
          path: page

      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }} -DEXPLORER_WEB_DIR=page
          cmake --build --preset ${{ matrix.preset }}

      # The assets and the page are embedded, so the exe is the whole program. The archive
      # holds the package as the repo does: package.rant, the group and bin/.
      - name: Name the exe
        shell: bash
        run: |
          mkdir -p out pkg/bin
          name="rant-explorer-$(cat VERSION)-${{ matrix.name }}"
          exe=rant_explorer
          if [ -f bin/rant_explorer.exe ]; then exe=rant_explorer.exe; fi
          cp "bin/$exe" "out/$name${exe#rant_explorer}"
          cp "bin/$exe" pkg/bin/
          cp package.rant WebExplorer.run pkg/
          tar -czf "out/$name.tar.gz" -C pkg package.rant WebExplorer.run bin
          tar -tzvf "out/$name.tar.gz"
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: rant-explorer-${{ matrix.name }}
          path: out/*

  # The release makes the tag v<VERSION> on this commit, once every check above passed
  release:
    needs: [plan, web, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # a later commit's run that passed too finds the version taken and stops
      - name: The version is not released from another commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh prints the error body on a miss, so only a found tag is compared
          if at="$(gh api "repos/$GITHUB_REPOSITORY/commits/v${{ needs.plan.outputs.version }}" --jq .sha 2>/dev/null)"; then
            test "$at" = "$GITHUB_SHA"
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/rant-explorer-*/*
          generate_release_notes: true
